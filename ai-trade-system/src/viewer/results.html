<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trade - Backtest Results Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 20px;
        }
        h1 { font-size: 20px; margin-bottom: 16px; color: #fff; }
        h2 { font-size: 16px; margin: 20px 0 10px; color: #a0a0c0; }

        /* ファイル読み込み */
        #file-section {
            background: #16213e;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #file-section label { font-size: 14px; color: #a0a0c0; }
        #file-section input { margin-top: 8px; }

        /* 統計カード */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
        .stat-card .label {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        .stat-card.positive .value { color: #26a69a; }
        .stat-card.negative .value { color: #ef5350; }

        /* エクイティカーブ */
        #equity-chart {
            background: #16213e;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }
        #equity-canvas { width: 100%; height: 200px; }

        /* フィルタ */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .filter-bar button {
            padding: 6px 16px;
            border-radius: 4px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-bar button.active { background: #e94560; border-color: #e94560; }

        /* 画像グリッド */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .image-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
        }
        .image-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
        .image-card .info {
            padding: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.detected { background: #26a69a; color: #fff; }
        .badge.not-detected { background: #444; color: #888; }
        .badge.win { background: #26a69a; color: #fff; }
        .badge.loss { background: #ef5350; color: #fff; }

        .pnl-positive { color: #26a69a; }
        .pnl-negative { color: #ef5350; }

        #no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Backtest Results Viewer</h1>

    <div id="file-section">
        <label>バックテスト結果ファイル (result.json) を読み込む:</label><br>
        <input type="file" id="result-file" accept=".json">
    </div>

    <div id="content" style="display:none;">
        <!-- 統計 -->
        <h2>統計サマリー</h2>
        <div class="stats-grid" id="stats-grid"></div>

        <!-- エクイティカーブ -->
        <div id="equity-chart">
            <h2 style="margin-top:0;">エクイティカーブ（累積損益 %）</h2>
            <canvas id="equity-canvas"></canvas>
        </div>

        <!-- フィルタ -->
        <h2>判定結果一覧</h2>
        <div class="filter-bar">
            <button class="active" data-filter="all">全て</button>
            <button data-filter="detected">検出のみ (1)</button>
            <button data-filter="not-detected">未検出のみ (0)</button>
        </div>

        <!-- 画像グリッド -->
        <div class="image-grid" id="image-grid"></div>
    </div>

    <div id="no-data">result.json を読み込んでください</div>

    <script>
    (() => {
        let data = null;
        let chartsBasePath = '';
        let currentFilter = 'all';

        const resultFile = document.getElementById('result-file');
        const content = document.getElementById('content');
        const noData = document.getElementById('no-data');
        const statsGrid = document.getElementById('stats-grid');
        const imageGrid = document.getElementById('image-grid');
        const equityCanvas = document.getElementById('equity-canvas');

        resultFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // チャート画像のベースパスを推測
            // result.json と同じフォルダの charts/ にある想定
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    data = JSON.parse(ev.target.result);
                    noData.style.display = 'none';
                    content.style.display = 'block';
                    renderStats();
                    renderEquityCurve();
                    renderImages();
                } catch (err) {
                    alert('読み込みエラー: ' + err.message);
                }
            };
            reader.readAsText(file);
        });

        // フィルタ
        document.querySelectorAll('.filter-bar button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderImages();
            });
        });

        function renderStats() {
            const s = data.stats;
            const c = data.config;
            const cards = [
                { label: 'シグナル数', value: s.total_trades, cls: '' },
                { label: '勝率', value: s.win_rate_pct.toFixed(1) + '%', cls: s.win_rate_pct >= 50 ? 'positive' : 'negative' },
                { label: 'PF', value: s.profit_factor.toFixed(2), cls: s.profit_factor >= 1 ? 'positive' : 'negative' },
                { label: '累積損益', value: s.total_return_pct.toFixed(2) + '%', cls: s.total_return_pct >= 0 ? 'positive' : 'negative' },
                { label: '平均利益', value: s.avg_win_pct.toFixed(2) + '%', cls: 'positive' },
                { label: '平均損失', value: s.avg_loss_pct.toFixed(2) + '%', cls: 'negative' },
                { label: '最大DD', value: s.max_drawdown_pct.toFixed(2) + '%', cls: 'negative' },
                { label: 'パターン', value: c.pattern, cls: '' },
            ];

            statsGrid.innerHTML = cards.map(c => `
                <div class="stat-card ${c.cls}">
                    <div class="value">${c.value}</div>
                    <div class="label">${c.label}</div>
                </div>
            `).join('');
        }

        function renderEquityCurve() {
            const curve = data.stats.equity_curve;
            if (!curve || curve.length < 2) return;

            const canvas = equityCanvas;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = 200 * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const W = canvas.clientWidth;
            const H = 200;
            const pad = { top: 10, bottom: 20, left: 50, right: 10 };
            const cW = W - pad.left - pad.right;
            const cH = H - pad.top - pad.bottom;

            const maxVal = Math.max(...curve, 0);
            const minVal = Math.min(...curve, 0);
            const range = (maxVal - minVal) || 1;

            function toX(i) { return pad.left + (i / (curve.length - 1)) * cW; }
            function toY(v) { return pad.top + cH * (1 - (v - minVal) / range); }

            // 背景
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, W, H);

            // ゼロライン
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(pad.left, toY(0));
            ctx.lineTo(W - pad.right, toY(0));
            ctx.stroke();
            ctx.setLineDash([]);

            // カーブ
            ctx.strokeStyle = curve[curve.length - 1] >= 0 ? '#26a69a' : '#ef5350';
            ctx.lineWidth = 2;
            ctx.beginPath();
            curve.forEach((v, i) => {
                const x = toX(i);
                const y = toY(v);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // ラベル
            ctx.fillStyle = '#888';
            ctx.font = '11px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(maxVal.toFixed(1) + '%', pad.left - 5, pad.top + 10);
            ctx.fillText(minVal.toFixed(1) + '%', pad.left - 5, H - pad.bottom);
            ctx.fillText('0%', pad.left - 5, toY(0) + 4);
        }

        function renderImages() {
            if (!data || !data.metadata) return;

            // トレード結果をマップ化
            const tradeMap = {};
            if (data.trades) {
                data.trades.forEach(t => {
                    tradeMap[t.chart_image] = t;
                });
            }

            let items = data.metadata;
            if (currentFilter === 'detected') {
                items = items.filter(m => m.detected === 1);
            } else if (currentFilter === 'not-detected') {
                items = items.filter(m => m.detected === 0);
            }

            imageGrid.innerHTML = items.map(m => {
                const trade = tradeMap[m.file];
                const badgeCls = m.detected === 1 ? 'detected' : 'not-detected';
                const badgeText = m.detected === 1 ? 'DETECTED' : 'NOT';

                let tradeInfo = '';
                if (trade) {
                    const pnlCls = trade.net_pnl_pct >= 0 ? 'pnl-positive' : 'pnl-negative';
                    const winBadge = trade.win
                        ? '<span class="badge win">WIN</span>'
                        : '<span class="badge loss">LOSS</span>';
                    tradeInfo = `
                        <div style="padding:0 10px 10px; font-size:11px;">
                            ${winBadge}
                            <span class="${pnlCls}" style="margin-left:8px;">
                                ${trade.net_pnl_pct >= 0 ? '+' : ''}${trade.net_pnl_pct.toFixed(2)}%
                            </span>
                            <span style="color:#666; margin-left:8px;">
                                ${trade.entry_price.toFixed(1)} → ${trade.exit_price.toFixed(1)}
                            </span>
                        </div>
                    `;
                }

                // 画像はcharts/サブフォルダにある想定。File APIでは直接参照できないためプレースホルダー
                return `
                    <div class="image-card">
                        <div style="width:100%;aspect-ratio:1;background:#0a0a1a;display:flex;align-items:center;justify-content:center;color:#444;font-size:12px;"
                             data-file="${m.file}">
                            ${m.file}
                        </div>
                        <div class="info">
                            <span>${m.end_ts || ''}</span>
                            <span class="badge ${badgeCls}">${badgeText}</span>
                        </div>
                        ${tradeInfo}
                    </div>
                `;
            }).join('');
        }
    })();
    </script>
</body>
</html>
