<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6b82" />
    <meta name="description" content="名古屋市を初期表示するスマホ向け天気アプリ" />
    <title>名古屋天気</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-live="polite">
        <div class="topbar">
          <div>
            <p class="eyebrow">Weather</p>
            <h1 id="locationName">名古屋市</h1>
          </div>
          <div class="actions">
            <button class="icon-button" id="locationButton" type="button" aria-label="現在地の天気を表示">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v3m0 12v3M3 12h3m12 0h3M7.8 7.8l2.1 2.1m4.2 4.2 2.1 2.1m0-8.4-2.1 2.1m-4.2 4.2-2.1 2.1" />
                <circle cx="12" cy="12" r="3.2" />
              </svg>
            </button>
            <button class="icon-button" id="refreshButton" type="button" aria-label="天気を更新">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6v5h-5M4 18v-5h5" />
                <path d="M18.2 9A7 7 0 0 0 6.3 6.3L4 8.5m2 6.5a7 7 0 0 0 11.7 2.7L20 15.5" />
              </svg>
            </button>
          </div>
        </div>

        <div class="current-grid">
          <div>
            <div class="weather-mark" id="weatherMark">--</div>
            <p class="condition" id="conditionText">読み込み中</p>
          </div>
          <div class="temp-block">
            <div><span id="currentTemp">--</span><span class="unit">℃</span></div>
            <p id="updatedAt">--</p>
          </div>
        </div>

        <div class="metric-strip">
          <div>
            <span>体感</span>
            <strong id="feelsLike">--℃</strong>
          </div>
          <div>
            <span>降水</span>
            <strong id="rainNow">--mm</strong>
          </div>
          <div>
            <span>湿度</span>
            <strong id="humidity">--%</strong>
          </div>
          <div>
            <span>風</span>
            <strong id="wind">--m/s</strong>
          </div>
        </div>
      </section>

      <section class="panel status-panel" id="statusPanel" hidden>
        <p id="statusText"></p>
      </section>

      <section class="section-block">
        <div class="section-head">
          <h2>今日の時間別</h2>
          <span id="hourlyDate">--</span>
        </div>
        <div class="hourly-list" id="hourlyList" aria-label="時間別予報"></div>
      </section>

      <section class="section-block">
        <div class="section-head">
          <h2>7日間予報</h2>
          <span>名古屋市基準</span>
        </div>
        <div class="daily-list" id="dailyList" aria-label="週間予報"></div>
      </section>

      <footer>
        <span>Data: Open-Meteo</span>
      </footer>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
